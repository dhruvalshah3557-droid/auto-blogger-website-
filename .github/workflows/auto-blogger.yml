name: Auto Blogger

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install hero image toolchain
        run: |
          sudo gem install victor
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build .env from secrets
        run: |
          cat > .env <<EOF
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ADMIN_LOGIN_URL=${{ secrets.ADMIN_LOGIN_URL }}
          ADMIN_DASHBOARD_URL=${{ secrets.ADMIN_DASHBOARD_URL }}
          ADMIN_BLOG_URL=${{ secrets.ADMIN_BLOG_URL }}
          CONTENT_MODE=${{ secrets.CONTENT_MODE || 'llm' }}
          RSS_FEED_URL=${{ secrets.RSS_FEED_URL }}
          USER_LLM_BASE_URL=${{ secrets.USER_LLM_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          USER_LLM_API_KEY=${{ secrets.USER_LLM_API_KEY }}
          USER_LLM_MODEL=${{ secrets.USER_LLM_MODEL || 'gemini-flash-lite-latest' }}
          LLM_TEMPERATURE=${{ secrets.LLM_TEMPERATURE }}
          ARTICLES_PER_RUN=2
          TOPIC_POOL=${{ secrets.TOPIC_POOL }}
          AUTO_UPLOAD=${{ secrets.AUTO_UPLOAD || 'false' }}
          UPLOAD_SCHEDULE=${{ secrets.UPLOAD_SCHEDULE }}
          RUN_ONCE=true
          EOF

      - name: Run auto blogger
        run: node src/index.js
